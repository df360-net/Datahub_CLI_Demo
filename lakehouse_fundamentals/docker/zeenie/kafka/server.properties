# Single-broker KRaft (combined broker+controller) for the Zeenie streaming lab.
# Mounted to /mnt/shared/config/server.properties so the apache/kafka image uses it
# verbatim. We deliberately set process.roles HERE (not as a KAFKA_* env var): the image's
# configure script rewrites KAFKA_LISTENERS from KAFKA_ADVERTISED_LISTENERS (host -> 0.0.0.0)
# whenever KAFKA_PROCESS_ROLES is set in the ENV, which drops the CONTROLLER listener and
# breaks combined mode. Keeping it in the file bypasses that.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9093

# Dual listeners: INTERNAL for iceberg_net containers (Spark, Connect), EXTERNAL for LAN tools.
# Bind with EMPTY host (://:port = all interfaces), NOT 0.0.0.0 - in combined KRaft mode Kafka
# derives the controller's advertised address from `listeners`, and its validator rejects the
# literal string 0.0.0.0 ("nonroutable meta-address"). Empty host passes.
listeners=INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
advertised.listeners=INTERNAL://kafka:9092,EXTERNAL://192.168.0.21:29092
listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=INTERNAL
controller.listener.names=CONTROLLER

# single broker -> every replication factor must be 1, or topic creation hangs
num.partitions=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0

log.dirs=/var/lib/kafka/data
